<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,900&display=swap" rel="stylesheet">
<style>
/* Santor Media Ventures — social preview card, exactly 1200x630 (LinkedIn / OG standard).
   SMG brand: Ink Navy #0F1C2E ground, Orange #F47A21 accent, Roboto throughout,
   reversed lockup (the "signature look" per the brand guide). Rendered with
   Chrome headless --window-size=1200,630 so no resampling is needed. */
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background:#0F1C2E; font-family:Roboto,Arial,sans-serif;
  position:relative; color:#fff;
}
/* a soft orange bloom off the right edge so the navy field isn't dead flat */
.bloom{
  position:absolute; right:-190px; top:-150px; width:720px; height:720px;
  background:radial-gradient(circle, rgba(244,122,33,0.20) 0%, rgba(244,122,33,0.07) 42%, rgba(244,122,33,0) 68%);
}
.inner{position:absolute; left:0; top:0; padding:82px 88px 0}
.lockup{width:340px; display:block; margin-bottom:58px}
.rule{width:66px; height:5px; background:#F47A21; margin-bottom:30px}
h1{
  font-weight:900; font-size:58px; line-height:1.1; letter-spacing:-.022em;
  max-width:880px; color:#fff;
}
h1 span{color:#F47A21}
.sub{
  font-weight:400; font-size:25px; line-height:1.45; color:#C3CCD6;
  margin-top:26px; max-width:800px;
}
.strip{
  position:absolute; left:88px; bottom:52px; display:flex; gap:34px;
  font-size:16px; font-weight:500; letter-spacing:.14em; text-transform:uppercase;
  color:#9AA6B2;
}
.strip b{color:#F47A21; font-weight:700; margin-right:9px}
.edge{position:absolute; left:0; top:0; bottom:0; width:9px; background:#F47A21}
</style>
</head>
<body>
  <div class="bloom"></div>
  <div class="edge"></div>
  <div class="inner">
    <img class="lockup" src="smg-lockup.png" alt="Santor Media Ventures">
    <div class="rule"></div>
    <h1>AI for animators, without the <span>hype</span> or the <span>doom</span>.</h1>
    <p class="sub">Practical AI for working animators, from a feature animator who still animates every day.</p>
  </div>
  <div class="strip">
    <div><b>&#9679;</b>Reel Reviews</div>
    <div><b>&#9679;</b>The Animation Frontier</div>
    <div><b>&#9679;</b>Free tools</div>
  </div>
</body>
</html>
